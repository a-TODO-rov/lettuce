name: Publish reactor-free artifact

# Publishes the reactor-free distribution io.lettuce:lettuce, derived from the same source as
# lettuce-core by the AST transformer in lettuce-build-tools. This workflow does NOT build or
# republish lettuce-core - that stays with the canonical snapshot.yaml / version-and-release.yaml.
#
# JDK 17: lettuce-build-tools + JavaParser require it. The produced classes still target 1.8
# (maven.compiler.target=1.8), identical to the source they are stripped from.
#
# Version / channel:
#   * a *-SNAPSHOT version deploys to the Central snapshot repository (no signing required);
#   * a release version additionally requires GPG signing - mirror the sonatype-oss-release
#     profile from the root pom before publishing a non-snapshot.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build the AST transformer (lettuce-build-tools)
        run: mvn -B --no-transfer-progress -f lettuce-build-tools/pom.xml clean install

      - name: Build & publish io.lettuce:lettuce (reactor-free)
        run: |
          mvn -B --no-transfer-progress -f lettuce-reactor-free/pom.xml \
            -DskipTests -Dmaven.test.skip=true clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.OSSH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSH_TOKEN }}
